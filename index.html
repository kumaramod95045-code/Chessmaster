<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessMaster Store</title>
    <link rel="stylesheet" href="chess.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    
    <header>
        <div class="logo">
            <i class="fa-solid fa-chess"></i> ChessMaster
        </div>
        <nav>
            <a href="#shop">Shop</a>
            <a href="#about">About</a>
            <button id="cart-btn" class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i> Cart <span id="cart-count">0</span>
            </button>
        </nav>
    </header>


    <section class="hero">
        <div class="hero-content">
            <h1>Elevate Your Game</h1>
            <p>Discover professional chess sets, handcrafted boards, and tactical accessories.</p>
            <a href="#shop" class="btn">Shop Now</a>
        </div>
    </section>

    
    <main id="shop" class="container">
        <h2>Featured Chess Sets</h2>
        <div class="product-grid" id="product-grid">
    
        </div>
    </main>

    
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Your Shopping Cart</h2>
            <div id="cart-items">
            
            </div>
            <div class="cart-total">
                <h3>Total: $<span id="cart-total-price">0.00</span></h3>
            </div>
            <button id="checkout-btn" class="btn checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    
    <footer>
        <p>&copy; 2026 ChessMaster Store By Amod Kumar</p>
    </footer>

    
    <script src="chessscript.js"></script>
</body>
</html>
